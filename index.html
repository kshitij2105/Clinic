
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('clinic-theme-v2');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <title>Dr. Shraddha Wanje Clinic</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Welcome to Dr. Shraddha Wanje Clinic. Learn about our services and book an appointment."
    />
    <meta name="robots" content="index, follow" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
